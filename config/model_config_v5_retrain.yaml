    expert_hidden_units: [512, 256, 128]
    gate_hidden_units: [128, 64]
    tower_hidden_units: [128, 64]
    hidden_activations: relu
    net_regularizer: 0
    embedding_regularizer: 1.e-6
    batch_norm: True
    net_dropout: 0.1
    batch_size: 4096
    embedding_dim: 16
    epochs: 30
    shuffle: True
    seed: 2023
    monitor: 'AUC'
    monitor_mode: 'max'
    group_id: 'user_id'
    model_root: './checkpoints'
    num_workers: 3
    verbose: 1
    early_stop_patience: 8
    save_best_only: True