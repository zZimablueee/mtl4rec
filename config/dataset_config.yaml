KuaiRand1K:
  data_root: ./data
  data_format: csv
  train_data: ./data/KuaiRand1K/train.csv
  valid_data: ./data/KuaiRand1K/valid.csv
  test_data: ./data/KuaiRand1K/test.csv
  min_categr_count: 1
  feature_cols:
    - name: [user_id, video_id, author_id, tab, video_type, upload_type,
             user_active_degree, is_live_streamer, is_video_author,
             visible_status, music_id, music_type, is_lowactive_period,
             follow_user_num_range, fans_user_num_range, friend_user_num_range,
             register_days_range]
      active: True
      dtype: str
      type: categorical
      fill_na: ""
    - name: [duration_ms, fans_user_num, friend_user_num, register_days,
             video_duration, server_width, server_height, show_cnt, play_cnt,
             play_user_num, play_duration, complete_play_cnt, valid_play_cnt,
             long_time_play_cnt, play_progress, like_cnt, like_user_num,
             comment_cnt, comment_user_num, follow_cnt, share_cnt, collect_cnt,
             download_cnt, report_cnt,
             onehot_feat0, onehot_feat1, onehot_feat2, onehot_feat3, onehot_feat4,
             onehot_feat5, onehot_feat6, onehot_feat7, onehot_feat8, onehot_feat9,
             onehot_feat10, onehot_feat11, onehot_feat12, onehot_feat13, onehot_feat14,
             onehot_feat15, onehot_feat16, onehot_feat17]
      active: True
      dtype: float
      type: numeric
      fill_na: 0
      normalizer: StandardScaler
  label_col:
    - name: is_click
      dtype: float
    - name: is_like
      dtype: float
    - name: is_follow
      dtype: float
    - name: is_comment
      dtype: float
    - name: is_forward
      dtype: float
    - name: long_view
      dtype: float
    - name: is_hate
      dtype: float
    - name: is_profile_enter
      dtype: float
  group_id: 'user_id'
